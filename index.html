<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Tặng bà xã iu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@1,600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap">
<style id="app-style">
/* Layout: một tấm thiệp kính mờ đặt giữa bầu trời đêm tím mận, hoa rơi + pháo hoa phía sau */
:root {
  --night: #160a1c;
  --plum: #2c1235;
  --rose: #ff6f91;
  --blush: #ffc2d1;
  --gold: #ffd479;
  --ink: #fff4f7;
  --muted: #d9b8c6;
  --glass: rgba(44, 18, 53, 0.62);
  --line: rgba(255, 194, 209, 0.28);
  --f-script: "Great Vibes", "Segoe Script", cursive;
  --f-display: "Playfair Display", Georgia, serif;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; } /* để phần bị ẩn luôn ẩn, kể cả khi đưa lên GitHub */
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 0%, var(--plum) 0%, var(--night) 60%) fixed, var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  overflow-x: hidden;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; } /* pháo hoa nằm trước thiệp */

/* ---------- Ảnh hiện ra sau pháo hoa ---------- */
#photoShow {
  position: fixed; inset: 0; z-index: 15;
  display: grid; place-items: center; align-content: center; gap: 16px;
  padding-inline: 16px;
  background: rgba(22, 10, 28, .72);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: fadeIn .4s ease both;
}
.photo-frame {
  margin: 0; position: relative; box-sizing: border-box;
  max-width: min(92vw, 520px);
  padding: 10px 10px 14px; border-radius: 18px;
  background: linear-gradient(#fff8fa, #ffe3ec);
  box-shadow: 0 0 0 3px var(--gold), 0 0 40px rgba(255,111,145,.8), 0 0 90px rgba(255,212,121,.5);
  animation: pop .9s cubic-bezier(.2,1.5,.4,1) both;
}
.photo-frame img { display: block; max-width: 100%; max-height: 62vh; margin: 0 auto; border-radius: 10px; object-fit: contain; }
.photo-frame figcaption { font-family: var(--f-script); font-size: 30px; color: #c43d66; text-align: center; margin-top: 6px; }
.photo-list { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; }
.photo-list figure { margin: 0; position: relative; width: 72px; height: 72px; }
.photo-list img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.photo-list button {
  position: absolute; top: -7px; right: -7px; width: 24px; height: 24px; border-radius: 50%;
  border: 0; background: var(--rose); color: var(--ink); cursor: pointer; font: 600 14px/1 var(--f-body);
}
.photo-list button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@keyframes pop { from { transform: scale(.2) rotate(-12deg); opacity: 0; } }
@keyframes fadeIn { from { opacity: 0; } }
.stage {
  position: relative; z-index: 1;
  min-height: 100%;
  display: grid; place-items: center;
  padding-inline: 16px; padding-block: 32px;
  box-sizing: border-box;
}

/* ---------- Phong bì ---------- */
#intro { display: grid; justify-items: center; gap: 28px; text-align: center; }
#intro .eyebrow { letter-spacing: .22em; text-transform: uppercase; font-size: 12px; color: var(--gold); }
#intro h1 {
  font-family: var(--f-script); font-weight: 400; margin: 0;
  font-size: clamp(44px, 11vw, 84px); line-height: 1;
  text-wrap: balance;
  background: linear-gradient(90deg, var(--blush), var(--gold), var(--rose), var(--blush));
  background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 6s linear infinite;
}
.envelope {
  position: relative; width: min(320px, 82vw); aspect-ratio: 3 / 2; max-width: 100%;
  perspective: 900px; cursor: pointer; border: 0; padding: 0; background: none;
  filter: drop-shadow(0 18px 40px rgba(255, 111, 145, .35));
  animation: float 4s ease-in-out infinite;
}
.envelope:focus-visible { outline: 2px solid var(--gold); outline-offset: 8px; border-radius: 8px; }
.env-body, .env-flap, .env-letter { position: absolute; left: 0; right: 0; }
.env-body {
  inset: 0; border-radius: 8px;
  background: linear-gradient(160deg, #ff8fab, #e0507a);
  clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
  z-index: 3;
}
.env-back { position: absolute; inset: 0; border-radius: 8px; background: #c43d66; z-index: 1; }
.env-letter {
  left: 8%; right: 8%; top: 10%; height: 80%; border-radius: 6px; z-index: 2;
  background: linear-gradient(#fff8fa, #ffe3ec);
  display: grid; place-items: center;
  font-family: var(--f-script); color: #c43d66; font-size: 30px;
  transition: transform .9s cubic-bezier(.2,.8,.2,1) .35s;
}
.env-flap {
  top: 0; height: 58%; z-index: 4; transform-origin: top center;
  background: linear-gradient(180deg, #ffa3bb, #f06a91);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transition: transform .6s ease, z-index 0s .3s;
}
.seal {
  position: absolute; left: 50%; top: 44%; z-index: 5; translate: -50% -50%;
  width: 62px; height: 62px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffe6a6, var(--gold) 45%, #c99632);
  display: grid; place-items: center;
  font-family: var(--f-display); font-style: italic; font-size: 17px; color: #6b2140;
  box-shadow: 0 4px 14px rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.35);
  transition: opacity .3s ease;
}
.envelope.open .env-flap { transform: rotateX(180deg); z-index: 1; }
.envelope.open .seal { opacity: 0; }
.envelope.open .env-letter { transform: translateY(-58%); }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
#introTo { font-family: var(--f-script); font-size: 30px; color: var(--blush); margin: 0; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: 600 14px/1 var(--f-body); color: var(--night);
  background: linear-gradient(135deg, var(--gold), var(--blush));
  border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer;
  box-shadow: 0 6px 22px rgba(255, 212, 121, .35);
  transition: transform .2s ease, box-shadow .2s ease;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255, 212, 121, .5); }
.btn:disabled { opacity: .6; cursor: progress; transform: none; }
.btn:focus-visible, .chip:focus-visible, .chip:focus-within { outline: 2px solid var(--gold); outline-offset: 3px; }
.btn svg, .chip svg { width: 16px; height: 16px; flex: none; }

/* ---------- Thiệp ---------- */
#card {
  position: relative; width: 100%; max-width: 560px;
  border-radius: 28px; padding: 2px; box-sizing: border-box;
  animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both;
}
#card::before { /* viền ánh sáng xoay */
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px;
  background: conic-gradient(from var(--a, 0deg), var(--rose), var(--gold), #c9a7ff, #7fe3d0, var(--rose));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin 6s linear infinite;
}
#card::after {
  content: ""; position: absolute; inset: -30px; z-index: -1; border-radius: 50px;
  background: conic-gradient(from var(--a, 0deg), rgba(255,111,145,.35), rgba(255,212,121,.3), rgba(201,167,255,.3), rgba(255,111,145,.35));
  filter: blur(40px); animation: spin 6s linear infinite;
}
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.card-inner {
  position: relative; border-radius: 26px; background: var(--glass);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: 20px clamp(18px, 5vw, 40px) 28px;
  display: grid; gap: 14px; text-align: center;
}
#bouquet { width: 100%; max-width: 300px; justify-self: center; height: auto; overflow: visible; }
.eyebrow-card { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); margin: 0; }
.headline { margin: 0; display: grid; gap: 2px; }
.headline .script {
  font-family: var(--f-script); font-weight: 400; font-size: clamp(42px, 10vw, 64px); line-height: 1.05;
  background: linear-gradient(90deg, var(--blush), var(--gold), var(--rose), var(--blush));
  background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 6s linear infinite;
}
.headline .date {
  font-family: var(--f-display); font-style: italic; font-weight: 600;
  font-size: clamp(54px, 15vw, 96px); line-height: 1; letter-spacing: .02em;
  color: var(--ink);
  text-shadow: 0 0 18px rgba(255,111,145,.8), 0 0 42px rgba(255,212,121,.45);
  animation: glow 2.6s ease-in-out infinite alternate;
}
.letter { text-align: left; max-width: 62ch; justify-self: center; display: grid; gap: 10px; }
.to { font-family: var(--f-script); font-size: 30px; color: var(--blush); margin: 0; }
#msg { margin: 0; font-size: 15.5px; line-height: 1.75; color: var(--ink); min-height: 9.5em; font-weight: 300; white-space: pre-line; }
#msg .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--gold); vertical-align: -3px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
.from { font-family: var(--f-script); font-size: 28px; color: var(--gold); text-align: right; margin: 0; }
.milestone { font-size: 12px; color: var(--muted); margin: 0; letter-spacing: .04em; font-variant-numeric: tabular-nums; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-top: 6px; }
.chip {
  position: relative;
  display: inline-flex; align-items: center; gap: 7px;
  font: 400 13px/1 var(--f-body); color: var(--ink);
  background: rgba(255,255,255,.06); border: 1px solid var(--line);
  border-radius: 999px; padding: 9px 14px; cursor: pointer;
  transition: background .2s ease, border-color .2s ease;
}
.chip:hover { background: rgba(255,194,209,.14); border-color: var(--blush); }
.chip[aria-pressed="true"] { background: rgba(255,212,121,.18); border-color: var(--gold); color: var(--gold); }
.chip input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
#status { min-height: 1.2em; margin: 0; font-size: 12.5px; color: var(--muted); }

/* Bảng sửa: chỉ người có quyền sửa thiệp mới thấy */
#custom { border-top: 1px solid var(--line); padding-top: 12px; text-align: left; }
#custom summary { cursor: pointer; font-size: 13px; color: var(--gold); list-style: none; text-align: center; }
#custom summary::-webkit-details-marker { display: none; }
#custom summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
.owner-note { font-size: 12px; color: var(--muted); margin: 8px 0 0; text-align: center; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }
.fields label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); min-width: 0; }
.fields input:not([type=file]), .fields textarea {
  font: 400 14px/1.5 var(--f-body); color: var(--ink);
  background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
  min-width: 0; box-sizing: border-box; width: 100%;
}
.fields input:focus, .fields textarea:focus { outline: none; border-color: var(--gold); }
.fields .wide { grid-column: 1 / -1; }
.fields textarea { min-height: 110px; resize: vertical; }
.voice-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#voiceInfo { font-size: 12px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.fields .row { grid-column: 1 / -1; display: flex; justify-content: flex-end; }

/* hoa trong bó hoa */
.bloom { transform-box: fill-box; transform-origin: center; animation: bloom 1.3s cubic-bezier(.2,1.4,.4,1) both, sway 4.5s ease-in-out infinite alternate; }
.stem { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.2s ease-out forwards; }
.leaf { transform-box: fill-box; transform-origin: bottom center; animation: bloom 1s ease-out both; }

@keyframes shimmer { to { background-position: 300% 0; } }
@keyframes float { 50% { transform: translateY(-10px); } }
@keyframes rise { from { opacity: 0; transform: translateY(60px) scale(.92); } }
@keyframes spin { to { --a: 360deg; } }
@keyframes glow { to { text-shadow: 0 0 26px rgba(255,111,145,1), 0 0 60px rgba(255,212,121,.7); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes bloom { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
@keyframes sway { from { rotate: -4deg; } to { rotate: 4deg; } }
@keyframes draw { to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<template id="app-markup">
<main class="stage">
  <section id="intro">
    <p class="eyebrow">Ngày Phụ nữ Việt Nam · 20.10</p>
    <h1>Có thư gửi bạn</h1>
    <p id="introTo"></p>
    <button class="envelope" id="envelope" aria-label="Mở thiệp">
      <span class="env-back"></span>
      <span class="env-letter">20/10</span>
      <span class="env-body"></span>
      <span class="env-flap"></span>
      <span class="seal">20/10</span>
    </button>
    <button class="btn" id="openBtn">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.4 1.1 4.1 2.3h3C14.2 6.1 15.6 5 17.6 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z"></path></svg>
      Mở thiệp
    </button>
    <p class="hint">Bật âm thanh để nghe lời chúc và nhạc nền</p>
  </section>

  <article id="card" hidden="">
    <div class="card-inner">
      <svg id="bouquet" viewBox="0 0 300 250" aria-hidden="true"></svg>
      <p class="eyebrow-card">Ngày Phụ nữ Việt Nam</p>
      <h2 class="headline"><span class="script">Chúc mừng</span><span class="date">20/10</span></h2>

      <div class="letter">
        <p class="to">Gửi <span id="toName"></span>,</p>
        <p id="msg" aria-live="polite"></p>
        <p class="from">— <span id="fromName"></span></p>
      </div>

      <div class="controls">
        <button class="chip" id="voiceBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
          <span>Nghe lời chúc</span>
        </button>
        <button class="chip" id="musicBtn" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
          <span>Nhạc nền</span>
        </button>
        <button class="chip" id="fireBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3"></path></svg>
          <span>Bắn pháo hoa</span>
        </button>
      </div>
      <p id="status"></p>
      <p class="milestone">20.10.1930 – 20.10.2026 · 96 năm Hội Liên hiệp Phụ nữ Việt Nam</p>

      <details id="custom" hidden="">
        <summary>Sửa thiệp (chỉ bạn thấy phần này)</summary>
        <p class="owner-note">Người nhận chỉ xem được thiệp. Bấm "Lưu cho mọi người" thì link chia sẻ sẽ hiện đúng nội dung bạn sửa.</p>
        <form class="fields" id="customForm">
          <label for="inTo">Gửi đến<input id="inTo" maxlength="60"></label>
          <label for="inFrom">Người gửi<input id="inFrom" maxlength="60"></label>
          <label class="wide" for="inMsg">Lời chúc<textarea id="inMsg" maxlength="900"></textarea></label>
          <div class="voice-row">
            <label class="chip" for="voiceFile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v4"></path></svg>
              <span>Chèn giọng của bạn</span>
              <input type="file" id="voiceFile" accept="audio/*">
            </label>
            <button class="chip" id="voiceClear" type="button" hidden="">Bỏ giọng ghi âm</button>
            <span id="voiceInfo"></span>
          </div>
          <div class="voice-row">
            <label class="chip" for="photoFile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-8 8"></path></svg>
              <span>Chèn ảnh</span>
              <input type="file" id="photoFile" accept="image/*" multiple="">
            </label>
            <span id="photoInfo"></span>
          </div>
          <div class="photo-list" id="photoList"></div>
          <div class="row"><button class="btn" id="saveBtn" type="submit">Lưu cho mọi người</button></div>
        </form>
      </details>
    </div>
  </article>

  <div id="photoShow" hidden="" role="dialog" aria-modal="true" aria-label="Ảnh kỷ niệm">
    <figure class="photo-frame"><img id="photoImg" alt="Ảnh kỷ niệm"><figcaption id="photoCap"></figcaption></figure>
    <button class="chip" id="photoClose" type="button">Đóng ảnh</button>
  </div>

<script id="app-script">
(() => {
  /* ---- Nguồn gốc của trang: dùng để tự xuất bản lại khi chủ thiệp bấm Lưu ---- */
  const SRC = {
    style: document.getElementById("app-style").textContent,
    markup: document.getElementById("app-markup").innerHTML,
    script: document.getElementById("app-script").textContent
  };
  const FONTS = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@1,600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap">';
  const RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  const CLOSE = "</" + "script>";
  function buildDocument(d) {
    const json = JSON.stringify(d).replace(/</g, "\\u003c");
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + "</style></head><body>" +
      "<title>Tặng bà xã iu</title>\n" + FONTS + "\n" +
      '<style id="app-style">' + SRC.style + "</style>\n" +
      '<canvas id="sky" aria-hidden="true"></canvas>\n<canvas id="fx" aria-hidden="true"></canvas>\n' +
      '<template id="app-markup">' + SRC.markup + "</template>\n" +
      '<script type="application/json" id="card-data">' + json + CLOSE + "\n" +
      '<script id="app-script">' + SRC.script + CLOSE + "\n</body></html>";
  }

  const tpl = document.getElementById("app-markup");
  tpl.parentNode.insertBefore(tpl.content.cloneNode(true), tpl);

  let data = JSON.parse(document.getElementById("card-data").textContent);

  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PALETTE = ["#ff6f91", "#ffc2d1", "#ffd479", "#c9a7ff", "#7fe3d0", "#ff9a76"];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  $("introTo").textContent = "Gửi " + data.to;

  /* ================= Bầu trời: ánh sáng, cánh hoa, pháo hoa ================= */
  const cv = $("sky"), ctx = cv.getContext("2d");
  const fxCv = $("fx"), fctx = fxCv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const [c, x] of [[cv, ctx], [fxCv, fctx]]) {
      c.width = W * DPR; c.height = H * DPR;
      x.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
  }
  resize(); addEventListener("resize", resize);

  const sprites = PALETTE.map((c) => {
    const s = document.createElement("canvas"); s.width = s.height = 128;
    const g = s.getContext("2d"), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, c); gr.addColorStop(0.35, c + "88"); gr.addColorStop(1, c + "00");
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return s;
  });
  const bokeh = Array.from({ length: reduced ? 12 : 34 }, () => ({
    x: rand(0, 1), y: rand(0, 1), r: rand(18, 70), s: (Math.random() * sprites.length) | 0,
    vx: rand(-0.00012, 0.00012), vy: rand(-0.00018, -0.00004), ph: rand(0, 6.28), sp: rand(0.5, 1.5)
  }));

  const PETAL_COLORS = ["#ff8fab", "#ffb3c6", "#ffd1dc", "#ff6f91", "#ffe0b3", "#fff0f5", "#f7a6c7"];
  const newPetal = (x, y, burst) => ({
    x: x ?? rand(-40, W + 40), y: y ?? rand(-H, -10), s: rand(5, 11),
    vx: burst ? rand(-3, 3) : rand(-0.3, 0.5), vy: burst ? rand(-4, 0.5) : rand(0.5, 1.4),
    r: rand(0, 6.28), vr: rand(-0.04, 0.04), spin: rand(0, 6.28), vs: rand(0.03, 0.08),
    sway: rand(0, 6.28), c: pick(PETAL_COLORS), life: burst ? 1 : Infinity
  });
  let petals = Array.from({ length: reduced ? 15 : 55 }, () => { const p = newPetal(); p.y = rand(-H, H); return p; });

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(p.spin));
    ctx.globalAlpha = Math.min(1, p.life) * 0.9;
    const s = p.s;
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.bezierCurveTo(s * 0.95, -s * 0.75, s * 0.7, s * 0.65, 0, s);
    ctx.bezierCurveTo(-s * 0.7, s * 0.65, -s * 0.95, -s * 0.75, 0, -s);
    ctx.fillStyle = p.c; ctx.fill();
    ctx.restore();
  }

  let sparks = [], rockets = [];
  function launch(x, ty) {
    rockets.push({ x: x ?? rand(W * 0.15, W * 0.85), y: H + 10, ty: ty ?? rand(H * 0.1, H * 0.45), c: pick(PALETTE), vy: -Math.max(9, Math.sqrt(H) * 0.45) * rand(1, 1.15) });
  }
  function explode(x, y, c, n = 70) {
    const c2 = pick(PALETTE);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rand(-0.05, 0.05), sp = rand(1.5, 5);
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: rand(0.008, 0.016), c: i % 3 ? c : c2, size: rand(1.2, 2.4) });
    }
    for (let i = 0; i < 28; i++) {
      const t = (i / 28) * Math.PI * 2;
      const hx = 16 * Math.sin(t) ** 3, hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      sparks.push({ x, y, vx: hx * 0.13, vy: hy * 0.13, life: 1, decay: 0.012, c: "#ffd479", size: 1.8 });
    }
  }

  let fireworksOn = false, lastLaunch = 0, t0 = performance.now();
  function frame(now) {
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";
    for (const b of bokeh) {
      b.x += b.vx; b.y += b.vy;
      if (b.y < -0.1) { b.y = 1.1; b.x = rand(0, 1); }
      if (b.x < -0.1) b.x = 1.1; if (b.x > 1.1) b.x = -0.1;
      ctx.globalAlpha = 0.18 + 0.14 * Math.sin(t * b.sp + b.ph);
      const r = b.r; ctx.drawImage(sprites[b.s], b.x * W - r, b.y * H - r, r * 2, r * 2);
    }

    // pháo hoa: vẽ trên lớp phía trước thiệp
    fctx.clearRect(0, 0, W, H);
    fctx.globalCompositeOperation = "lighter";
    if (fireworksOn && !reduced && now - lastLaunch > 2400) { launch(); lastLaunch = now + rand(-500, 600); }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.y += r.vy; r.vy *= 0.985;
      fctx.globalAlpha = 1; fctx.fillStyle = r.c;
      fctx.fillRect(r.x - 1.5, r.y, 3, 12);
      if (r.y <= r.ty || r.vy > -2) { explode(r.x, r.y, r.c); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vx *= 0.985; s.vy = s.vy * 0.985 + 0.04; s.life -= s.decay;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      fctx.globalAlpha = s.life;
      fctx.strokeStyle = s.c; fctx.lineWidth = s.size;
      fctx.beginPath(); fctx.moveTo(s.x - s.vx * 3, s.y - s.vy * 3); fctx.lineTo(s.x, s.y); fctx.stroke();
    }
    fctx.globalAlpha = 1;

    ctx.globalCompositeOperation = "source-over";
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      p.sway += 0.02;
      p.x += p.vx + Math.sin(p.sway) * 0.6; p.y += p.vy; p.r += p.vr; p.spin += p.vs;
      if (p.life !== Infinity) { p.vy += 0.06; p.vx *= 0.98; p.life -= 0.008; if (p.life <= 0) { petals.splice(i, 1); continue; } }
      else if (p.y > H + 20) { Object.assign(p, newPetal()); p.y = -20; }
      drawPetal(p);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  addEventListener("pointerdown", (e) => {
    if (e.target.closest("button, label, input, textarea, summary, details, a")) return;
    for (let i = 0; i < 18; i++) petals.push(newPetal(e.clientX, e.clientY, true));
    explode(e.clientX, e.clientY, pick(PALETTE), 40);
  });

  /* ================= Bó hoa nở ================= */
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };
  function buildBouquet() {
    const svg = $("bouquet"); svg.innerHTML = "";
    const defs = el("defs", {}, svg);
    const FLOWERS = [
      { x: 150, y: 70, r: 38, a: "#ff4d79", b: "#ffc2d1", d: 0.9 },
      { x: 95, y: 98, r: 30, a: "#ff8fab", b: "#fff0f5", d: 1.1 },
      { x: 206, y: 96, r: 31, a: "#ffb347", b: "#ffe9b8", d: 1.25 },
      { x: 120, y: 40, r: 22, a: "#c77dff", b: "#f1ddff", d: 1.45 },
      { x: 185, y: 38, r: 23, a: "#ff6f91", b: "#ffe0ea", d: 1.6 },
      { x: 60, y: 62, r: 17, a: "#ffd479", b: "#fff6d8", d: 1.8 },
      { x: 242, y: 60, r: 18, a: "#f7a6c7", b: "#ffffff", d: 1.9 }
    ];
    FLOWERS.forEach((f, i) => {
      const g = el("radialGradient", { id: "fg" + i, cx: "50%", cy: "50%", r: "60%" }, defs);
      el("stop", { offset: "0%", "stop-color": f.b }, g);
      el("stop", { offset: "100%", "stop-color": f.a }, g);
    });
    const stems = el("g", {}, svg);
    FLOWERS.forEach((f, i) => {
      el("path", { class: "stem", d: `M150 232 Q ${(150 + f.x) / 2 + (f.x < 150 ? -10 : 10)} ${(232 + f.y) / 2 + 20} ${f.x} ${f.y}`,
        stroke: "#5fbf8f", "stroke-width": 2.4, fill: "none", "stroke-linecap": "round", style: `animation-delay:${0.2 + i * 0.08}s` }, stems);
    });
    [[110, 170, -40], [190, 168, 40], [128, 150, -20], [172, 148, 25], [80, 140, -55], [222, 138, 55]].forEach(([x, y, rot], i) => {
      el("path", { class: "leaf", d: `M${x} ${y} q -8 -22 0 -40 q 8 18 0 40z`, fill: i % 2 ? "#4fae80" : "#6fd3a0",
        transform: `rotate(${rot} ${x} ${y})`, style: `animation-delay:${0.7 + i * 0.07}s` }, svg);
    });
    FLOWERS.forEach((f, i) => {
      const g = el("g", { class: "bloom", style: `animation-delay:${f.d}s, ${f.d + 1.3}s` }, svg);
      [[8, 1, 0], [7, 0.72, 22], [5, 0.46, 10]].forEach(([n, k, off]) => {
        for (let j = 0; j < n; j++) {
          const ang = (360 / n) * j + off;
          el("ellipse", { cx: f.x, cy: f.y - f.r * 0.5 * k, rx: f.r * 0.36 * k, ry: f.r * 0.55 * k,
            fill: `url(#fg${i})`, stroke: "rgba(255,255,255,.35)", "stroke-width": 0.6,
            transform: `rotate(${ang} ${f.x} ${f.y})` }, g);
        }
      });
      el("circle", { cx: f.x, cy: f.y, r: f.r * 0.16, fill: "#ffd479" }, g);
      el("circle", { cx: f.x - f.r * 0.05, cy: f.y - f.r * 0.05, r: f.r * 0.06, fill: "#fff6d8" }, g);
    });
    const bow = el("g", { class: "leaf", style: "animation-delay:2.1s" }, svg);
    el("path", { d: "M150 214 C 120 196, 108 226, 150 220 C 192 226, 180 196, 150 214 Z", fill: "#ff6f91", stroke: "#ffc2d1", "stroke-width": 1 }, bow);
    el("path", { d: "M146 220 L 132 246 L 142 242 L 148 248 Z M154 220 L 168 246 L 158 242 L 152 248 Z", fill: "#e0507a" }, bow);
    el("circle", { cx: 150, cy: 217, r: 5, fill: "#ffd479" }, bow);
  }

  /* ================= Chữ chạy ================= */
  let typeTimer = null;
  function render(typing) {
    $("toName").textContent = data.to;
    $("fromName").textContent = data.from;
    const msg = $("msg");
    clearInterval(typeTimer);
    if (!typing || reduced) { msg.textContent = data.msg; return; }
    let i = 0; msg.textContent = "";
    const caret = document.createElement("span"); caret.className = "caret";
    const txt = document.createTextNode(""); msg.append(txt, caret);
    typeTimer = setInterval(() => {
      txt.data = data.msg.slice(0, ++i);
      if (i >= data.msg.length) { clearInterval(typeTimer); setTimeout(() => caret.remove(), 1500); }
    }, 42);
  }

  /* ================= Giọng nói ================= */
  const status = (s) => { $("status").textContent = s; };
  let viVoice = null, voiceAudio = null;
  function findVoice() {
    if (!("speechSynthesis" in window)) return;
    const vs = speechSynthesis.getVoices();
    viVoice = vs.find((v) => /^vi/i.test(v.lang) && /natural|online|hoaimy|google/i.test(v.name)) || vs.find((v) => /^vi/i.test(v.lang)) || null;
  }
  if ("speechSynthesis" in window) { findVoice(); speechSynthesis.onvoiceschanged = findVoice; }

  function speak() {
    if (data.voice) {
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      if (!voiceAudio || voiceAudio.dataset.src !== data.voice) {
        voiceAudio = new Audio(data.voice); voiceAudio.dataset.src = data.voice;
      }
      voiceAudio.currentTime = 0; duck(true);
      voiceAudio.onended = () => { duck(false); status(""); };
      voiceAudio.play().then(() => status("Đang phát lời chúc")).catch(() => { duck(false); status("Bấm \"Nghe lời chúc\" để nghe giọng nói."); });
      return;
    }
    if (!("speechSynthesis" in window)) { status("Trình duyệt này không hỗ trợ đọc lời chúc."); return; }
    speechSynthesis.cancel();
    const text = `Chúc mừng ngày Phụ nữ Việt Nam, hai mươi tháng mười. Gửi ${data.to}. ${data.msg.replace(/20\/10/g, "hai mươi tháng mười")} ${data.from}.`;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "vi-VN"; if (viVoice) u.voice = viVoice;
    u.rate = 0.92; u.pitch = 1.1; u.volume = 1;
    u.onstart = () => { duck(true); status(viVoice ? "Đang đọc lời chúc…" : "Đang đọc lời chúc (máy chưa có giọng tiếng Việt, có thể đọc chưa chuẩn)"); };
    u.onend = u.onerror = () => { duck(false); status(""); };
    speechSynthesis.speak(u);
  }

  /* ================= Nhạc nền (hộp nhạc ngũ cung) ================= */
  let ac = null, master = null, musicOn = false, schedTimer = null, nextT = 0, idx = 0, bar = 0, beatInBar = 0, ducked = false;
  const MEL = [[64,1],[67,1],[69,1],[67,1],[64,1],[62,1],[60,2],[62,1],[64,1],[67,1],[69,.5],[72,.5],[69,2],[67,1],[69,1],[72,1],[74,1],[72,1],[69,1],[67,2],[64,1],[62,1],[60,1],[57,1],[60,4]];
  const BASS = [48, 45, 41, 43];
  const BEAT = 60 / 84;
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function note(m, t, dur, type, vol) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function initAudio() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0;
    const delay = ac.createDelay(), fb = ac.createGain(), wet = ac.createGain();
    delay.delayTime.value = BEAT * 0.75; fb.gain.value = 0.32; wet.gain.value = 0.35;
    master.connect(ac.destination); master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ac.destination);
  }
  function schedule() {
    while (nextT < ac.currentTime + 0.25) {
      const [m, d] = MEL[idx];
      note(m + 12, nextT, d * BEAT * 1.6, "sine", 0.16);
      note(m, nextT, d * BEAT * 1.2, "triangle", 0.05);
      if (beatInBar === 0) {
        const root = BASS[bar % 4];
        note(root, nextT, BEAT * 4, "sine", 0.12);
        note(root + 7, nextT + BEAT * 2, BEAT * 2, "sine", 0.06);
        bar++;
      }
      beatInBar = (beatInBar + d) % 4;
      nextT += d * BEAT; idx = (idx + 1) % MEL.length;
    }
  }
  function setMusic(on) {
    initAudio(); if (!ac) return;
    musicOn = on; $("musicBtn").setAttribute("aria-pressed", String(on));
    if (on) {
      ac.resume();
      if (!schedTimer) { nextT = ac.currentTime + 0.1; schedTimer = setInterval(schedule, 60); }
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.linearRampToValueAtTime(ducked ? 0.25 : 0.8, ac.currentTime + 1);
    } else {
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.linearRampToValueAtTime(0, ac.currentTime + 0.5);
      setTimeout(() => { if (!musicOn) { clearInterval(schedTimer); schedTimer = null; } }, 600);
    }
  }
  function duck(on) {
    ducked = on; if (!ac || !musicOn) return;
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.linearRampToValueAtTime(on ? 0.25 : 0.8, ac.currentTime + 0.6);
  }

  /* ================= Mở thiệp ================= */
  let opened = false;
  function showCard(withSound) {
    $("intro").hidden = true;
    $("card").hidden = false;
    buildBouquet();
    render(true);
    fireworksOn = true;
    for (let i = 0; i < 3; i++) setTimeout(launch, i * 350);
    for (let i = 0; i < 40; i++) petals.push(newPetal(rand(0, W), rand(-60, 0)));
    if (withSound) setTimeout(speak, 900);
    scrollTo({ top: 0, behavior: "smooth" });
  }
  function openCard() {
    if (opened) return; opened = true;
    $("envelope").classList.add("open");
    setMusic(true);
    setTimeout(() => showCard(true), 1300);
  }
  $("envelope").addEventListener("click", openCard);
  $("openBtn").addEventListener("click", openCard);

  $("voiceBtn").addEventListener("click", () => { render(true); speak(); });
  $("musicBtn").addEventListener("click", () => setMusic(!musicOn));
  /* ---- Bắn pháo hoa xong thì hiện ảnh ---- */
  let photoIdx = 0, photoTimer = null;
  const photos = () => (Array.isArray(data.photos) ? data.photos : []);
  function closePhoto() { $("photoShow").hidden = true; }
  function showPhoto() {
    const list = photos(); if (!list.length) return;
    $("photoImg").src = list[photoIdx % list.length]; photoIdx++;
    $("photoCap").textContent = "Tặng " + data.to;
    $("photoShow").hidden = false;
    // pháo nổ quanh khung ảnh khi ảnh bung ra
    const cx = W / 2, cy = H / 2;
    [[-0.32, -0.3], [0.32, -0.28], [-0.28, 0.25], [0.3, 0.27], [0, -0.38]].forEach(([dx, dy], i) =>
      setTimeout(() => explode(cx + dx * Math.min(W, 640), cy + dy * H, pick(PALETTE), 60), 150 + i * 180));
    for (let i = 0; i < 40; i++) petals.push(newPetal(rand(0, W), rand(-60, 0)));
  }
  function volley() {
    closePhoto(); clearTimeout(photoTimer);
    const n = 6;
    for (let i = 0; i < n; i++) setTimeout(() => launch(W * (0.15 + (0.7 * i) / (n - 1)) + rand(-20, 20), H * rand(0.15, 0.4)), i * 160);
    for (let i = 0; i < 30; i++) petals.push(newPetal(rand(0, W), rand(-60, 0)));
    if (photos().length) photoTimer = setTimeout(showPhoto, 1700);
  }
  $("fireBtn").addEventListener("click", volley);
  $("photoClose").addEventListener("click", closePhoto);
  $("photoShow").addEventListener("click", (e) => { if (e.target.id === "photoShow") closePhoto(); });
  addEventListener("keydown", (e) => { if (e.key === "Escape") closePhoto(); });

  /* ================= Sửa thiệp: chỉ người có quyền sửa ================= */
  let draftVoice = data.voice, draftVoiceName = data.voiceName || "";
  const MAX_VOICE = 8 * 1024 * 1024;
  function showVoiceInfo() {
    $("voiceInfo").textContent = draftVoice ? "Đang dùng: " + (draftVoiceName || "giọng ghi âm") : "Chưa có, thiệp sẽ dùng giọng đọc tự động";
    $("voiceClear").hidden = !draftVoice;
  }
  let draftPhotos = photos().slice();
  const MAX_PHOTOS = 6;
  function renderPhotoList() {
    const list = $("photoList"); list.textContent = "";
    draftPhotos.forEach((src, i) => {
      const fig = document.createElement("figure");
      const img = document.createElement("img"); img.src = src; img.alt = "Ảnh " + (i + 1);
      const del = document.createElement("button"); del.type = "button"; del.textContent = "×";
      del.setAttribute("aria-label", "Bỏ ảnh " + (i + 1));
      del.addEventListener("click", () => { draftPhotos.splice(i, 1); renderPhotoList(); status("Đã bỏ ảnh. Bấm \"Lưu cho mọi người\" để áp dụng."); });
      fig.append(img, del); list.append(fig);
    });
    $("photoInfo").textContent = draftPhotos.length
      ? `${draftPhotos.length}/${MAX_PHOTOS} ảnh · hiện lần lượt sau mỗi lần bắn pháo hoa`
      : "Chưa có ảnh, bắn pháo hoa sẽ không hiện ảnh";
  }
  // thu nhỏ ảnh về tối đa 1280px để thiệp nhẹ, mở nhanh trên điện thoại
  function compressPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }

  async function setupEditor() {
    const cl = window.claude;
    if (!cl || !cl.use) return;
    const [user, artifact] = await Promise.all([cl.use("user"), cl.use("artifact")]);
    const canEdit = user ? await user.canEdit() : false;
    if (!canEdit || !artifact) return;

    $("custom").hidden = false;
    $("inTo").value = data.to; $("inFrom").value = data.from; $("inMsg").value = data.msg;
    showVoiceInfo();
    renderPhotoList();

    $("photoFile").addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []); e.target.value = "";
      if (!files.length) return;
      const room = MAX_PHOTOS - draftPhotos.length;
      if (room <= 0) { status(`Thiệp chứa tối đa ${MAX_PHOTOS} ảnh. Bỏ bớt ảnh rồi chèn lại.`); return; }
      status("Đang xử lý ảnh…");
      let failed = 0;
      for (const f of files.slice(0, room)) {
        try { draftPhotos.push(await compressPhoto(f)); } catch (err) { failed++; }
      }
      renderPhotoList();
      const skipped = files.length - room > 0 ? ` Chỉ lấy ${room} ảnh đầu vì thiệp chứa tối đa ${MAX_PHOTOS} ảnh.` : "";
      status((failed ? `Có ${failed} ảnh không đọc được, hãy thử ảnh .jpg hoặc .png. ` : "Đã chèn ảnh. ") + "Bấm \"Lưu cho mọi người\" để bà xã xem được." + skipped);
    });

    // Bản nháp cũ từng sửa trên máy này (phiên bản trước chỉ lưu trong trình duyệt)
    try {
      const old = JSON.parse(localStorage.getItem("thiep2010") || "null");
      if (old && (old.to !== data.to || old.from !== data.from || old.msg !== data.msg)) {
        $("inTo").value = old.to || data.to; $("inFrom").value = old.from || data.from; $("inMsg").value = old.msg || data.msg;
        $("custom").open = true;
        status("Đã điền lại nội dung bạn sửa trước đây. Bấm \"Lưu cho mọi người\" để link chia sẻ hiện đúng.");
      }
    } catch (e) {}

    try {
      if (sessionStorage.getItem("thiep-saved")) {
        sessionStorage.removeItem("thiep-saved");
        opened = true; showCard(false);
        status("Đã lưu. Ai mở link chia sẻ cũng sẽ thấy đúng thiệp này.");
      }
    } catch (e) {}

    $("voiceFile").addEventListener("change", (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > MAX_VOICE) { status("File ghi âm lớn hơn 8 MB. Hãy cắt ngắn hoặc nén lại rồi chèn lần nữa."); e.target.value = ""; return; }
      const reader = new FileReader();
      reader.onload = () => {
        draftVoice = reader.result; draftVoiceName = f.name;
        showVoiceInfo();
        const preview = new Audio(draftVoice);
        preview.play().catch(() => {});
        status("Đã chèn giọng nói. Bấm \"Lưu cho mọi người\" để người nhận nghe được.");
      };
      reader.onerror = () => status("Không đọc được file này. Hãy thử file .mp3 hoặc .m4a.");
      reader.readAsDataURL(f);
      e.target.value = "";
    });
    $("voiceClear").addEventListener("click", () => {
      draftVoice = null; draftVoiceName = ""; showVoiceInfo();
      status("Đã bỏ giọng ghi âm. Bấm \"Lưu cho mọi người\" để áp dụng.");
    });

    $("customForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const next = {
        to: $("inTo").value.trim() || data.to,
        from: $("inFrom").value.trim() || data.from,
        msg: $("inMsg").value.trim() || data.msg,
        voice: draftVoice || null,
        voiceName: draftVoice ? draftVoiceName : "",
        photos: draftPhotos.slice()
      };
      const btn = $("saveBtn");
      btn.disabled = true; btn.textContent = "Đang lưu…";
      try { sessionStorage.setItem("thiep-saved", "1"); } catch (err) {}
      try {
        await artifact.publish(buildDocument(next));
        try { localStorage.removeItem("thiep2010"); } catch (err) {}
        status("Đã lưu. Trang đang tải lại bản mới…");
      } catch (err) {
        try { sessionStorage.removeItem("thiep-saved"); } catch (e2) {}
        btn.disabled = false; btn.textContent = "Lưu cho mọi người";
        const code = err && err.code;
        if (code === "conflict") status("Thiệp vừa được cập nhật ở nơi khác. Trang sẽ tải lại bản mới nhất, hãy sửa lại nếu cần.");
        else if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required" || code === "capability_disabled") { $("custom").hidden = true; status("Bạn chỉ có quyền xem thiệp này."); }
        else if (code === "too_large") status("Thiệp quá lớn để lưu. Hãy dùng file ghi âm ngắn hơn.");
        else if (code === "rate_limited") status("Bạn vừa lưu nhiều lần liên tiếp. Đợi một lát rồi bấm Lưu lại.");
        else status("Chưa lưu được do lỗi kết nối. Hãy bấm Lưu lại sau ít phút.");
      }
    });
  }
  setupEditor();
})();
</script>
</body></html>
